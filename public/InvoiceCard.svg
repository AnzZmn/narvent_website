<svg viewBox="0 0 650 370" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:24px;font-weight:400;text-anchor:start;dominant-baseline:auto">Narvent invoice card example</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:24px;font-weight:400;text-anchor:start;dominant-baseline:auto">An invoice card for April showing 126 shifts consolidated across 12 locations and 84 gig talents, covering shifts and statutory contributions, marked as paid.</desc>
<defs>
<pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
<circle cx="1.2" cy="1.2" r="1.2" fill="var(--border)"/>
</pattern>
</defs>
<rect x="0" y="0" width="640" height="360" fill="url(#dots)" style="stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:24px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<rect x="80" y="40" width="480" height="280" rx="16" fill="var(--surface-2)" stroke="var(--border-strong)" stroke-width="1" style="fill:rgb(255, 255, 255);stroke:color(srgb 0.0431373 0.0431373 0.0431373 / 0.2);color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:24px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="112" y="92" font-family="var(--font-mono)" font-size="13" letter-spacing="2" fill="var(--text-accent)" style="fill:rgb(24, 79, 149);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, monospace;font-size:13px;font-weight:400;text-anchor:start;dominant-baseline:auto">INVOICE · APRIL</text>
<line x1="112" y1="108" x2="528" y2="108" stroke="var(--border)" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:color(srgb 0.0431373 0.0431373 0.0431373 / 0.1);color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:24px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="112" y="150" font-family="var(--font-mono)" font-size="18" fill="var(--text-primary)" style="fill:rgb(11, 11, 11);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, monospace;font-size:18px;font-weight:400;text-anchor:start;dominant-baseline:auto">126 shifts consolidated</text>
<text x="112" y="184" font-family="var(--font-mono)" font-size="18" fill="var(--text-primary)" style="fill:rgb(11, 11, 11);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, monospace;font-size:18px;font-weight:400;text-anchor:start;dominant-baseline:auto">12 locations · 84 gig talents</text>
<text x="112" y="218" font-family="var(--font-mono)" font-size="18" fill="var(--text-primary)" style="fill:rgb(11, 11, 11);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, monospace;font-size:18px;font-weight:400;text-anchor:start;dominant-baseline:auto">shifts + statutory contributions</text>
<line x1="112" y1="256" x2="528" y2="256" stroke="var(--border)" stroke-width="1" style="fill:rgb(0, 0, 0);stroke:color(srgb 0.0431373 0.0431373 0.0431373 / 0.1);color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;anthropic-sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:24px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
<text x="112" y="288" font-family="var(--font-mono)" font-size="13" letter-spacing="2" fill="var(--text-muted)" style="fill:rgb(137, 135, 129);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:ui-monospace, monospace;font-size:13px;font-weight:400;text-anchor:start;dominant-baseline:auto">PAID</text>
</svg>