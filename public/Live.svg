<g id="Live">
<rect width="300" height="300" fill="white"/>
<style>
    .pulse {
      animation: pulsate 1.8s infinite ease-out;
      transform-origin: 20px 20px;
    }
    .text-live {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 1.5px;
      fill: #7D69FF;
    }
    @keyframes pulsate {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(2.4); opacity: 0; }
      100% { transform: scale(2.4); opacity: 0; }
    }
  </style>
  
  <!-- Pulsing outer ring -->
  <g id="top" transform="translate(20, 55)"> 
  <circle class="pulse" cx="20" cy="20" r="12" fill="#7D69FF" opacity="0.3"/>
  
  <!-- Solid inner dot -->
  <circle cx="20" cy="20" r="10" fill="#7D69FF"/>
  
  <!-- LIVE text aligned to match the image spacing -->
  <text x="45" y="25" class="text-live">LIVE</text>
    </g>
